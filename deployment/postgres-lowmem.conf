# =============================================================================
# PostgreSQL 15 tuned for a 256 MB container budget on a 1 GB GCP e2-micro.
# Mount at /etc/postgresql.conf (see docker-compose.lean.yml).
#
# Postgres defaults assume a dedicated server: shared_buffers=128MB,
# work_mem=4MB, max_connections=100. On this box that is fatal, because
# work_mem is allocated PER SORT/HASH NODE PER CONNECTION — 100 connections
# doing a couple of sorts each can want gigabytes, and the kernel OOM-killer
# will pick the largest process. That is your database.
# =============================================================================

# ── Identity (must match the container env) ─────────────────────────────────
listen_addresses = '*'
port = 5432

# ── Memory ──────────────────────────────────────────────────────────────────
# 25% of the 256 MB limit. Raising this does not help a catalogue your size;
# it just leaves less for the OS page cache, which matters more here.
shared_buffers = 64MB

# Deliberately tiny. The killer on small boxes. With max_connections=30 and
# 2MB, worst case is ~60MB of sort memory instead of ~400MB.
work_mem = 2MB
maintenance_work_mem = 32MB

# Effective cache size is a *hint* to the planner, not an allocation. Tell it
# the truth: the VM has ~1GB and Postgres may use the page cache.
effective_cache_size = 192MB

# ── Connections ─────────────────────────────────────────────────────────────
# One daphne process with DB_CONN_MAX_AGE=600 holds a small persistent pool.
# 30 is generous and bounds the memory maths above.
max_connections = 30
superuser_reserved_connections = 2

# ── Durability ──────────────────────────────────────────────────────────────
# synchronous_commit=off trades up to ~0.6s of committed transactions on a hard
# crash for noticeably faster writes. For a catalogue + order workload on a
# burstable 0.25 vCPU this is the right trade — and you have a nightly dump.
# If you would rather never lose an acknowledged order, set this to `on`.
synchronous_commit = off
wal_level = replica
max_wal_size = 256MB
min_wal_size = 64MB
checkpoint_timeout = 10min
checkpoint_completion_target = 0.9

# ── Planner ─────────────────────────────────────────────────────────────────
# 0.25 vCPU baseline. Discourage parallel plans: parallel workers each cost
# their own work_mem and gain nothing on a quarter core.
max_worker_processes = 2
max_parallel_workers = 0
max_parallel_workers_per_gather = 0
random_page_cost = 1.1          # SSD-backed persistent disk
effective_io_concurrency = 200

# ── Autovacuum ──────────────────────────────────────────────────────────────
# Keep it, but gentle. Turning autovacuum off to "save RAM" causes table bloat
# and transaction-ID wraparound, which is far worse.
autovacuum = on
autovacuum_naptime = 60s
autovacuum_max_workers = 1
autovacuum_vacuum_cost_delay = 20ms

# ── Logging ─────────────────────────────────────────────────────────────────
log_min_duration_statement = 1000   # log anything over 1s: finds your N+1s
log_line_prefix = '%t [%p] %q%u@%d '
log_statement = 'ddl'
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0

# ── Locale / encoding ───────────────────────────────────────────────────────
datestyle = 'iso, mdy'
timezone = 'Africa/Nairobi'
lc_messages = 'C.UTF-8'
default_text_search_config = 'pg_catalog.english'

# ── Extensions you will want ────────────────────────────────────────────────
# Uncomment once you have run `CREATE EXTENSION pg_trgm;` — it makes the
# product search in ProductViewSet (search_fields = ["@name", "@description"])
# actually indexable instead of a sequential scan on every keystroke.
#shared_preload_libraries = ''
