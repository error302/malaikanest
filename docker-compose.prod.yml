version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: malaikanest
      POSTGRES_USER: malaika
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U malaika"]
      interval: 5s
      retries: 5

  # Redis for caching and sessions
  # AOF + periodic RDB snapshots for crash resilience.
  # The persistent volume (redis_data) keeps data across restarts;
  # AOF fsync=everysec ensures at most 1 second of data loss on crash.
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    command:
      - redis-server
      - --appendonly yes
      - --appendfsync everysec
      - --save 900 1
      - --save 300 10
      - --save 60 10000
      - --auto-aof-rewrite-percentage 100
      - --auto-aof-rewrite-min-size 64mb  # Backend - Django API (primary)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql://malaika:${POSTGRES_PASSWORD:-change_this_password}@db:5432/malaikanest"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_media:/app/media
      - staticfiles:/app/staticfiles

  # Backend Replica — hot-standby Django/Gunicorn instance.
  # Nginx load-balances across 'backend' and 'backend_replica' using the
  # upstream block. If the primary goes down, Nginx routes all traffic to the
  # replica (and vice versa). StartPeriod is shorter — the replica skips
  # migrations/collectstatic (the primary handles those).
  backend_replica:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql://malaika:${POSTGRES_PASSWORD:-change_this_password}@db:5432/malaikanest"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_media:/app/media
      - staticfiles:/app/staticfiles

  # Frontend - Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-https://api.malaikanest.com}"
      NODE_ENV: "production"
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Nginx - Reverse Proxy
  # Load-balances across backend + backend_replica for redundancy.
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx-production.conf:/etc/nginx/conf.d/default.conf
      - staticfiles:/usr/share/nginx/html/static
    depends_on:
      - frontend
      - backend
      - backend_replica

volumes:
  postgres_data:
  redis_data:
  staticfiles:
  backend_media:

