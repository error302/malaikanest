{% extends "storefront/base.html" %}

{% block title %}Page Not Found · 404 · Malaika Nest{% endblock %}

{% block content %}
<section class="max-w-3xl mx-auto px-4 py-20 sm:py-32 text-center">
  <div class="w-16 h-16 rounded-full bg-amber-50 text-amber-700 flex items-center justify-center mx-auto mb-6">
    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
  </div>
  <h1 class="font-serif text-3xl sm:text-4xl text-[#2C1810] font-bold mb-4">Page Not Found</h1>
  <p class="text-stone-600 text-sm sm:text-base mb-8 max-w-md mx-auto">
    The page or product you were looking for doesn't exist or may have been moved.
  </p>
  <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
    <a href="{% url 'storefront:home' %}" class="w-full sm:w-auto px-6 py-3 rounded-xl bg-[#2C1810] text-[#F4EBE1] text-sm font-semibold hover:bg-black transition-colors">
      Return to Home
    </a>
    <a href="{% url 'storefront:product_list' %}" class="w-full sm:w-auto px-6 py-3 rounded-xl border border-[#EADBCE] text-[#2C1810] text-sm font-medium hover:bg-stone-50 transition-colors">
      Browse Catalogue
    </a>
  </div>
</section>
{% endblock %}
