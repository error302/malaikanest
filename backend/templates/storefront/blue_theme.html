<style>
/* ── Coastal blue palette (overrides warm gold tokens in base) ───────────── */

  background: #eef7fd;
  line-height: 1.7;
  font-size: 15px;
  color: #12324a;
  overflow-wrap: anywhere;
}

/* Sticky mobile add-to-cart / checkout bars */
.nest-sticky-cta {
  display: none;
}
@media (max-width: 767px) {
