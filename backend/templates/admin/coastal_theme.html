<style>
:root, html[data-theme="light"] {
  color-scheme:light;
  --primary:#28594f; --secondary:#234b43; --accent:#f2d6c5;
  --primary-fg:#fff; --body-fg:#30251f; --body-bg:#fcfaf5;
  --body-quiet-color:#645e57; --body-loud-color:#30251f;
  --header-color:#fff; --header-branding-color:#fff; --header-bg:#28594f;
  --header-link-color:#fff; --breadcrumbs-bg:#e8f0eb; --breadcrumbs-fg:#30251f;
  --breadcrumbs-link-fg:#28594f; --link-fg:#28594f; --link-hover-color:#183d35;
  --link-selected-fg:#183d35; --hairline-color:#e3e5dd; --border-color:#d2d9d0;
  --darkened-bg:#f0f3ed; --selected-bg:#e8f0eb; --selected-row:#eff5ec;
  --button-bg:#28594f; --button-hover-bg:#183d35;
  --default-button-bg:#28594f; --default-button-hover-bg:#183d35;
  --close-button-bg:#645e57; --close-button-hover-bg:#30251f;
  --font-family-primary:system-ui,-apple-system,"Segoe UI",sans-serif;
}
html[data-theme="dark"] {
  color-scheme:dark; --primary:#8ebeb0; --secondary:#254c43; --header-bg:#254c43;
  --primary-fg:#172823; --body-bg:#172823; --body-fg:#eaf1eb;
  --body-quiet-color:#bccbc0; --body-loud-color:#fff;
  --darkened-bg:#21392f; --selected-bg:#304d41; --selected-row:#304d41;
  --border-color:#52685b; --hairline-color:#3f5749;
  --link-fg:#b5d7c3; --link-hover-color:#fff; --link-selected-fg:#eaf1eb;
  --button-bg:#b5d7c3; --button-hover-bg:#daecdf;
  --default-button-bg:#b5d7c3; --default-button-hover-bg:#daecdf;
  --breadcrumbs-bg:#21392f; --breadcrumbs-fg:#eaf1eb; --breadcrumbs-link-fg:#b5d7c3;
}
#header { padding:22px 32px; }
.nest-brand { display:flex; gap:12px; align-items:center; }
.nest-brand img { border-radius:12px; background:#fff; }
.nest-brand a { font-size:23px; font-weight:750; letter-spacing:-.6px; }
.nest-brand span { display:block; font-size:9px; letter-spacing:1.8px; margin-top:5px; color:#e8f0eb; }
div.breadcrumbs { padding:14px 32px; }
#content { padding:32px; }
.module { border:1px solid var(--border-color); border-radius:12px; overflow:hidden; margin-bottom:24px; }
.module h2, .module caption { padding:13px 16px; font-weight:650; font-size:14px; }
td, th { padding:12px; }
input, textarea, select { border-radius:7px; }
input[type=text], input[type=password], input[type=email], input[type=number], select { min-height:38px; box-sizing:border-box; }
.button, input[type=submit], input[type=button], .submit-row input, a.button { border-radius:8px; padding:12px 18px; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:3px solid #cb784f; outline-offset:3px; }

#nav-sidebar .module { border:0; }
#nav-sidebar th, #nav-sidebar td { padding:10px; }
.nest-welcome { padding:24px; border:1px solid var(--border-color); border-radius:16px; background:var(--darkened-bg); margin-bottom:24px; }
.nest-welcome h2 { font-size:25px; margin:0 0 8px; }
.nest-welcome p { max-width:65ch; font-size:14px; line-height:1.7; }
.nest-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
.nest-actions a { display:inline-block; padding:12px 17px; background:var(--button-bg); color:var(--primary-fg); border-radius:8px; font-weight:600; }
body.login { background:var(--body-bg); }
body.login #container { width:min(440px,calc(100% - 32px)); margin:9vh auto; border:1px solid var(--border-color); border-radius:18px; overflow:hidden; box-shadow:0 20px 65px #28594f14; }
body.login #header { padding:26px; }
body.login #content { padding:26px; }
