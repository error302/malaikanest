{% load static %}<style>
/* Malaika Nest admin theme — mirrors the storefront design system:
   ivory paper (#fffdfa), deep navy ink (#1b304a), blue tint (#e5edf6),
   butter accents (#fcf0d9), mango focus (#f2a03d), Fraunces headings. */
@font-face {
  font-family: 'Fraunces';
  src: url("{% static 'nest-home/fraunces-latin.woff2' %}") format('woff2');
  font-weight: 300 900;
  font-display: swap;
}
:root, html[data-theme="light"] {
  color-scheme:light;
  --primary:#253c59; --secondary:#1b304a; --accent:#fcf0d9;
  --primary-fg:#fff; --body-fg:#253c59; --body-bg:#fffdfa;
  --body-quiet-color:#526579; --body-loud-color:#1b304a;
  --header-color:#fff; --header-branding-color:#fff; --header-bg:#1b304a;
  --header-link-color:#fff; --breadcrumbs-bg:#e5edf6; --breadcrumbs-fg:#253c59;
  --breadcrumbs-link-fg:#253c59; --link-fg:#253c59; --link-hover-color:#1b304a;
  --link-selected-fg:#1b304a; --hairline-color:#e0e7ef; --border-color:#d4dce6;
  --darkened-bg:#f3f6f9; --selected-bg:#e5edf6; --selected-row:#eef4fa;
  --button-bg:#1b304a; --button-hover-bg:#16263c;
  --default-button-bg:#1b304a; --default-button-hover-bg:#16263c;
  --close-button-bg:#526579; --close-button-hover-bg:#1b304a;
  --font-family-primary:system-ui,-apple-system,"Segoe UI",sans-serif;
}
html[data-theme="dark"] {
  color-scheme:dark; --primary:#9db8d4; --secondary:#1b304a; --header-bg:#16263c;
  --primary-fg:#12203a; --body-bg:#16263c; --body-fg:#e6ecf5;
  --body-quiet-color:#b6c4d6; --body-loud-color:#fff;
  --darkened-bg:#1d3250; --selected-bg:#253c59; --selected-row:#253c59;
  --border-color:#3d5578; --hairline-color:#2f4666;
  --link-fg:#b9cde4; --link-hover-color:#fff; --link-selected-fg:#e6ecf5;
  --button-bg:#b9cde4; --button-hover-bg:#d7e3f1;
  --default-button-bg:#b9cde4; --default-button-hover-bg:#d7e3f1;
  --breadcrumbs-bg:#1d3250; --breadcrumbs-fg:#e6ecf5; --breadcrumbs-link-fg:#b9cde4;
}
#header { padding:22px 32px; }
.nest-brand { display:flex; gap:12px; align-items:center; }
.nest-brand img { border-radius:12px; background:#fff; }
.nest-brand a { font-family:'Fraunces',Georgia,serif; font-size:23px; font-weight:650; letter-spacing:-.4px; }
.nest-brand span { display:block; font-family:var(--font-family-primary); font-size:9px; letter-spacing:1.8px; margin-top:5px; color:#c9d8ea; }
div.breadcrumbs { padding:14px 32px; }
#content { padding:32px; }
h1, .module h2, .module caption { font-family:'Fraunces',Georgia,serif; letter-spacing:-.2px; }
.module { border:1px solid var(--border-color); border-radius:12px; overflow:hidden; margin-bottom:24px; }
.module h2, .module caption { padding:13px 16px; font-weight:650; font-size:14px; }
td, th { padding:12px; }
input, textarea, select { border-radius:7px; }
input[type=text], input[type=password], input[type=email], input[type=number], select { min-height:38px; box-sizing:border-box; }
.button, input[type=submit], input[type=button], .submit-row input, a.button { border-radius:8px; padding:12px 18px; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:3px solid #f2a03d; outline-offset:3px; }
#nav-sidebar { padding:14px 8px; }
#nav-sidebar .module { border:0; }
#nav-sidebar th, #nav-sidebar td { padding:10px; }
.nest-welcome { padding:24px; border:1px solid var(--border-color); border-radius:16px; background:var(--darkened-bg); margin-bottom:24px; }
.nest-welcome h2 { font-size:25px; margin:0 0 8px; }
.nest-welcome p { max-width:65ch; font-size:14px; line-height:1.7; }
.nest-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
.nest-actions a { display:inline-block; padding:12px 17px; background:var(--button-bg); color:var(--primary-fg); border-radius:8px; font-weight:600; }
body.login { background:var(--body-bg); }
body.login #container { width:min(440px,calc(100% - 32px)); margin:9vh auto; border:1px solid var(--border-color); border-radius:18px; overflow:hidden; box-shadow:0 20px 65px rgba(27,48,74,.10); }
body.login #header { padding:26px; }
body.login #content { padding:26px; }
body.login #content h1 { font-size:24px; }
body.login .form-row { padding:10px 0; }
body.login .form-row label { font-size:14px; }
body.login .submit-row { padding:18px 0 0; }
body.login .submit-row input { width:100%; font-size:15px; }
@media(max-width:767px) { #header { padding:18px; } #content { padding:18px; } div.breadcrumbs { padding:12px 18px; } .nest-welcome { padding:18px; } .nest-actions a { flex:1; text-align:center; } }
@media(prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition:none!important; } }
</style>
