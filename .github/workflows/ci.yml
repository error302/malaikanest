name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: malaika_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d malaika_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DB_NAME: malaika_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      SECRET_KEY: ci-test-secret-key-not-for-production
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install -r requirements-dev.txt
      # HARD GATE. F821 (undefined name) is the rule that would have stopped six
      # production crashes: RefreshToken, audit_log x4, url, plus the four found
      # by hand earlier (invalidate_all_user_tokens, settings, Decimal, exc x2).
      # py_compile passes all of them because NameError is runtime-only.
      - name: Ruff - blocking (undefined names, redefinitions, syntax)
        run: ruff check . --select F821,F811,F822,F823,E9 --output-format github

      # Advisory only. The codebase currently has ~470 style findings (unused
      # imports, trailing whitespace, import order). Do not block PRs on these
      # until they are cleaned up; run `ruff check . --fix` locally to burn most
      # of them down in one pass, then promote this step to blocking.
      - name: Ruff - advisory (style)
        continue-on-error: true
        run: ruff check . --statistics
      - name: Django system check
        run: python manage.py check
      - name: Django tests
        run: python manage.py test --verbosity=2 --keepdb

  docker-build:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: malaikanest-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: malaikanest-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
