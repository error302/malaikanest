name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via Docker Compose on VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="$HOME/malaikanest"
            if [ ! -d "$APP_DIR/.git" ] && [ -d "/opt/malaikanest/.git" ]; then
              APP_DIR="/opt/malaikanest"
            fi
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Expected deployment repo at $APP_DIR but it was not found."
              exit 1
            fi

            cd "$APP_DIR"
            git stash push --include-untracked -m "github-actions-predeploy-$(date +%Y%m%d%H%M%S)" || true
            git pull --ff-only origin main

            # Migrations run inside the backend container entrypoint on start.
            docker compose build --pull backend frontend
            docker compose up -d --remove-orphans
            docker image prune -f

      - name: Verify health through the tunnel
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://api.malaikanest.com/api/health/ || true)
            if [ "$code" = "200" ]; then
              echo "Backend healthy (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: HTTP $code — retrying in 10s"
            sleep 10
          done
          echo "Health check failed 5 minutes after deploy."
          exit 1
