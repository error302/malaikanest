name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Self-hosted runner on the Oracle VM. The runner polls GitHub outbound —
  # no inbound SSH required.
  #
  # PRODUCTION RUNS docker-compose.lean.yml (web / db / cloudflared), NOT the
  # full docker-compose.yml stack — the VM has 956 MB RAM and the full stack
  # would OOM it. See docs/HANDOFF-KILO-*.md before changing this job.
  # Setup: run deployment/setup-gh-runner.sh once on the VM (see that file).
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    runs-on: [self-hosted, malaikanest]
    timeout-minutes: 30
    steps:
      - name: Deploy via Docker Compose (lean stack)
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="$HOME/malaikanest"
          if [ ! -d "$APP_DIR/.git" ] && [ -d "/opt/malaikanest/.git" ]; then
            APP_DIR="/opt/malaikanest"
          fi
          if [ ! -d "$APP_DIR/.git" ]; then
            echo "Expected deployment repo at $APP_DIR but it was not found."
            exit 1
          fi

          cd "$APP_DIR"

          # cloudflared/config.yml is intentionally pinned to the lean stack's
          # service name (web:8000) on this VM — the repo version points at
          # backend:8000, which only exists in the full (non-production) stack.
          # Discard the local pin so the pull cannot conflict, then re-apply it.
          git checkout -- cloudflared/config.yml 2>/dev/null || true
          git pull --ff-only origin main
          sed -i 's#http://backend:8000#http://web:8000#g' cloudflared/config.yml
          echo "Ingress after lean-stack pin:"
          grep 'service:' cloudflared/config.yml

          # Rollback point before replacing the running image.
          docker tag malaikanest-web:latest \
            "malaikanest-web:before-deploy-$(date +%Y%m%d%H%M%S)" || true

          # Sync Brevo authorized IPs for email delivery. The API key lives in
          # backend/.env (never printed). Non-blocking on failure.
          echo "Syncing Brevo authorized IPs..."
          key=$(grep -E '^BREVO_API_KEY=' backend/.env 2>/dev/null | cut -d= -f2- || true)
          if [ -n "$key" ]; then
            BREVO_API_KEY="$key" python3 scripts/ops/sync_brevo_ips.py \
              || echo "Warning: Brevo IP sync failed (non-blocking)"
          else
            echo "No BREVO_API_KEY in backend/.env — skipping (non-blocking)"
          fi

          # Migrations + collectstatic run inside the container via
          # backend/deploy/start-web.sh on every start — no manual step needed.
          docker compose -f docker-compose.lean.yml build web
          docker compose -f docker-compose.lean.yml up -d web
          docker image prune -f

          # Authoritative health gate: the container's own healthcheck (same
          # Host-header trick as the compose healthcheck, from inside).
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' malaikanest-web-1 2>/dev/null || echo "unknown")
            if [ "$status" = "healthy" ]; then
              echo "web healthy (attempt $i)"
              break
            fi
            echo "Attempt $i: health=$status — retrying in 10s"
            if [ "$i" = "30" ]; then
              docker logs --tail 50 malaikanest-web-1 || true
              echo "web never became healthy."
              exit 1
            fi
            sleep 10
          done

      - name: Advisory external check
        if: always()
        shell: bash
        run: |
          # Cloudflare bot protection may challenge datacenter IPs (GitHub
          # runners), so a non-200 here is NOT necessarily an outage — the
          # authoritative gate above runs on the VM itself.
          code=$(curl -s -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0 (deploy-check)' \
            https://api.malaikanest.com/api/health/ || true)
          echo "External probe status: $code (advisory)"
