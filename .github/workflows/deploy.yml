name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="/var/www/malaikanest"
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Expected deployment repo at $APP_DIR but it was not found."
              exit 1
            fi

            cd "$APP_DIR"
            git pull --ff-only origin main

            if [ ! -x "$APP_DIR/deploy.sh" ]; then
              chmod +x "$APP_DIR/deploy.sh"
            fi

            bash "$APP_DIR/deploy.sh"

            curl --fail --silent --show-error https://malaikanest.duckdns.org/api/health/
