services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kenya_ecom}
      POSTGRES_USER: ${POSTGRES_USER:-kenya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kenya_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kenya} -d ${POSTGRES_DB:-kenya_ecom}"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env.example
    environment:
      DJANGO_ENV: ${DJANGO_ENV:-dev}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings}
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-please-change-this-in-production-32chars-min}
      SIMPLE_JWT_SECRET: ${SIMPLE_JWT_SECRET:-django-insecure-jwt-dev-secret-key-change-in-prod-32-char-min-aaaa}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,frontend,malaikanest.duckdns.org,www.malaikanest.duckdns.org}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://backend:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DB_NAME: ${POSTGRES_DB:-kenya_ecom}
      DB_USER: ${POSTGRES_USER:-kenya}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-kenya_password}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MPESA_ENV: ${MPESA_ENV:-sandbox}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-local-placeholder}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-local-placeholder}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-local-placeholder}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-174379}
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:-http://localhost:8000/api/v1/payments/mpesa/callback/}
      MPESA_STRICT_SIGNATURE: ${MPESA_STRICT_SIGNATURE:-false}
      # Email (SMTP via Gmail)
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-malaikanest7@gmail.com}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Malaika Nest <malaikanest7@gmail.com>}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Host port 8000 is already used by another stack on this machine; bind
      # the backend to 8081 on the host instead.
      - "8081:8000"
    volumes:
      # NOTE: backend WORKDIR is /code, not /app — the original compose had a typo.
      - ./backend/media:/code/media
      - ./backend/staticfiles:/code/staticfiles
    command:
      - sh
      - -c
      - |
        python manage.py migrate --noinput &&
        python manage.py create_superuser || true &&
        python manage.py seed_categories || true &&
        python manage.py seed_delivery_zones || true &&
        python manage.py collectstatic --noinput &&
        gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env.example
    environment:
      DJANGO_ENV: ${DJANGO_ENV:-dev}
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-please-change-this-in-production-32chars-min}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,frontend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DB_NAME: ${POSTGRES_DB:-kenya_ecom}
      DB_USER: ${POSTGRES_USER:-kenya}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-kenya_password}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # In dev the workers run tasks synchronously in the web process; this worker
      # only catches the beat-scheduled ones that dev.py doesn't override.
      CELERY_TASK_ALWAYS_EAGER: "false"
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-malaikanest7@gmail.com}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Malaika Nest <malaikanest7@gmail.com>}
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ./backend/media:/code/media
      - ./backend/staticfiles:/code/staticfiles
    command: celery -A config worker -l info --concurrency=2

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env.example
    environment:
      DJANGO_ENV: ${DJANGO_ENV:-dev}
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-please-change-this-in-production-32chars-min}
      DB_NAME: ${POSTGRES_DB:-kenya_ecom}
      DB_USER: ${POSTGRES_USER:-kenya}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-kenya_password}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./backend/media:/code/media
      - ./backend/staticfiles:/code/staticfiles
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Host port 3000 is occupied by another stack (metardu-app); use 3090.
      - "3090:3000"
    environment:
      # The browser running on the host machine reaches the backend at localhost.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      # Server-side fetches from inside the docker network use the backend hostname.
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
      # Canonical production domain used for SEO metadata, sitemap and robots.
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://malaikanest.com}
      NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
      NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
      DATABASE_URL: file:./dev.db
    depends_on:
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
