services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kenya_ecom}
      POSTGRES_USER: ${POSTGRES_USER:-kenya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kenya_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kenya} -d ${POSTGRES_DB:-kenya_ecom}"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    # AOF + periodic RDB snapshots for crash resilience.
    # Every write is fsynced to disk; combined with the persistent volume
    # (redis_data) this ensures zero data loss on a container restart.
    command:
      - redis-server
      - --appendonly yes
      - --appendfsync everysec
      - --save 900 1
      - --save 300 10
      - --save 60 10000
      - --auto-aof-rewrite-percentage 100
      - --auto-aof-rewrite-min-size 64mb

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      DJANGO_ENV: ${DJANGO_ENV:-dev}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings}
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-please-change-this-in-production-32chars-min}
      SIMPLE_JWT_SECRET: ${SIMPLE_JWT_SECRET:-django-insecure-jwt-dev-secret-key-change-in-prod-32-char-min-aaaa}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,frontend,malaikanest.com,www.malaikanest.com,api.malaikanest.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://backend:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DB_NAME: ${POSTGRES_DB:-kenya_ecom}
      DB_USER: ${POSTGRES_USER:-kenya}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-kenya_password}
      DB_HOST: db
      DB_PORT: 5432
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MPESA_ENV: ${MPESA_ENV:-sandbox}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-local-placeholder}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-local-placeholder}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-local-placeholder}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-174379}
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:-http://localhost:8000/api/v1/payments/mpesa/callback/}
      MPESA_STRICT_SIGNATURE: ${MPESA_STRICT_SIGNATURE:-false}
      PESAPAL_CONSUMER_KEY: ${PESAPAL_CONSUMER_KEY:-}
      PESAPAL_CONSUMER_SECRET: ${PESAPAL_CONSUMER_SECRET:-}
      PESAPAL_ENV: ${PESAPAL_ENV:-sandbox}
      PESAPAL_MOCK_MODE: ${PESAPAL_MOCK_MODE:-true}
      PESAPAL_IPN_ID: ${PESAPAL_IPN_ID:-}
      PESAPAL_CALLBACK_URL: ${PESAPAL_CALLBACK_URL:-http://localhost:8000/api/v1/payments/pesapal/callback/}
      PESAPAL_IPN_URL: ${PESAPAL_IPN_URL:-http://localhost:8000/api/v1/payments/pesapal/ipn/}
      # Email (SMTP via Brevo — outbound transactional mail)
      EMAIL_HOST: ${EMAIL_HOST:-smtp-relay.brevo.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-b2ad26001@smtp-brevo.com}
      # EMAIL_HOST_PASSWORD intentionally NOT set here so the value from backend/.env (env_file) is used
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Malaika Nest <hello@malaikanest.com>}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Host port 8000 is already used by another stack on this machine; bind
      # the backend to 8081 on the host instead.
      - "127.0.0.1:8081:8000"
    volumes:
      # NOTE: backend WORKDIR is /code, not /app — the original compose had a typo.
      - ./backend/media:/code/media
      - ./backend/staticfiles:/code/staticfiles
    command:
      - sh
      - -c
      - |
        set -e
        python manage.py migrate --noinput
        python manage.py create_superuser || true
        python manage.py seed_categories || true
        python manage.py seed_delivery_zones || true
        python manage.py collectstatic --noinput
        exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 4 --timeout 60
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/api/health/', headers={'Host': 'api.malaikanest.com', 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Backend Replica ────────────────────────────────────────────────────────
  # Hot-standby Django/Gunicorn container that serves as a second upstream.
  # Nginx (or cloudflared) load-balances across backend and backend_replica.
  # This eliminates the single-container SPOF.
  backend_replica:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      DJANGO_ENV: ${DJANGO_ENV:-dev}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings}
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-please-change-this-in-production-32chars-min}
      SIMPLE_JWT_SECRET: ${SIMPLE_JWT_SECRET:-django-insecure-jwt-dev-secret-key-change-in-prod-32-char-min-aaaa}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,backend_replica,frontend,malaikanest.com,www.malaikanest.com,api.malaikanest.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://backend:3000,http://backend_replica:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DB_NAME: ${POSTGRES_DB:-kenya_ecom}
      DB_USER: ${POSTGRES_USER:-kenya}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-kenya_password}
      DB_HOST: db
      DB_PORT: 5432
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MPESA_ENV: ${MPESA_ENV:-sandbox}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-local-placeholder}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-local-placeholder}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-local-placeholder}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-174379}
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:-http://localhost:8000/api/v1/payments/mpesa/callback/}
      MPESA_STRICT_SIGNATURE: ${MPESA_STRICT_SIGNATURE:-false}
      PESAPAL_CONSUMER_KEY: ${PESAPAL_CONSUMER_KEY:-}
      PESAPAL_CONSUMER_SECRET: ${PESAPAL_CONSUMER_SECRET:-}
      PESAPAL_ENV: ${PESAPAL_ENV:-sandbox}
      PESAPAL_MOCK_MODE: ${PESAPAL_MOCK_MODE:-true}
      PESAPAL_IPN_ID: ${PESAPAL_IPN_ID:-}
      PESAPAL_CALLBACK_URL: ${PESAPAL_CALLBACK_URL:-http://localhost:8000/api/v1/payments/pesapal/callback/}
      PESAPAL_IPN_URL: ${PESAPAL_IPN_URL:-http://localhost:8000/api/v1/payments/pesapal/ipn/}
      EMAIL_HOST: ${EMAIL_HOST:-smtp-relay.brevo.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-b2ad26001@smtp-brevo.com}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Malaika Nest <hello@malaikanest.com>}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/media:/code/media
      - ./backend/staticfiles:/code/staticfiles
    command:
      - sh
      - -c
      - |
        set -e
        # Replica does NOT run migrations or collectstatic — those are the
        # primary's responsibility. It waits for the primary to finish them.
        exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 4 --timeout 60
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/api/health/', headers={'Host': 'api.malaikanest.com', 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      DJANGO_ENV: ${DJANGO_ENV:-dev}
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-please-change-this-in-production-32chars-min}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,frontend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DB_NAME: ${POSTGRES_DB:-kenya_ecom}
      DB_USER: ${POSTGRES_USER:-kenya}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-kenya_password}
      DB_HOST: db
      DB_PORT: 5432
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # In dev the workers run tasks synchronously in the web process; this worker
      # only catches the beat-scheduled ones that dev.py doesn't override.
      CELERY_TASK_ALWAYS_EAGER: "false"
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-malaikanest7@gmail.com}
      # EMAIL_HOST_PASSWORD intentionally NOT set here so the value from backend/.env is used
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Malaika Nest <hello@malaikanest.com>}
      PESAPAL_CONSUMER_KEY: ${PESAPAL_CONSUMER_KEY:-}
      PESAPAL_CONSUMER_SECRET: ${PESAPAL_CONSUMER_SECRET:-}
      PESAPAL_ENV: ${PESAPAL_ENV:-sandbox}
      PESAPAL_MOCK_MODE: ${PESAPAL_MOCK_MODE:-true}
      PESAPAL_IPN_ID: ${PESAPAL_IPN_ID:-}
      PESAPAL_CALLBACK_URL: ${PESAPAL_CALLBACK_URL:-http://localhost:8000/api/v1/payments/pesapal/callback/}
      PESAPAL_IPN_URL: ${PESAPAL_IPN_URL:-http://localhost:8000/api/v1/payments/pesapal/ipn/}
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ./backend/media:/code/media
      - ./backend/staticfiles:/code/staticfiles
    command: celery -A config worker -l info --concurrency=2

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      DJANGO_ENV: ${DJANGO_ENV:-dev}
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-please-change-this-in-production-32chars-min}
      DB_NAME: ${POSTGRES_DB:-kenya_ecom}
      DB_USER: ${POSTGRES_USER:-kenya}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-kenya_password}
      DB_HOST: db
      DB_PORT: 5432
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./backend/media:/code/media
      - ./backend/staticfiles:/code/staticfiles
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* are inlined into the client bundle at build time. The
        # browser on malaikanest.com must call the API at api.malaikanest.com
        # (cloudflared routes that hostname to the backend service).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.malaikanest.com}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://malaikanest.com}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
    restart: unless-stopped
    ports:
      # Host port 3000 is occupied by another stack (metardu-app); use 3090.
      - "127.0.0.1:3090:3000"
    environment:
      # Kept in sync with the build arg for any server-side reads.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.malaikanest.com}
      # Server-side fetches from inside the docker network use the backend hostname.
      INTERNAL_API_URL: ${INTERNAL_API_URL:-https://api.malaikanest.com}
      # Canonical production domain used for SEO metadata, sitemap and robots.
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://malaikanest.com}
      NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
      NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
      # The Next.js CMS (branding, content blocks, testimonials, thrifted, blog,
      # loyalty) is stored in SQLite on a persistent named volume so admin edits
      # survive container rebuilds/redeploys.
      DATABASE_URL: file:/app/data/cms.db
    volumes:
      - frontend_cms_data:/app/data
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

  # Hot-standby cloudflared tunnel instance.
  # Both instances connect to the same Cloudflare tunnel simultaneously.
  # Cloudflare load-balances across both and will fail over to the standby
  # if the primary goes down — no DNS TTL delay, instant failover.
  cloudflared_standby:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  frontend_cms_data:
